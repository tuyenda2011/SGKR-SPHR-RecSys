[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-rec-sparsity"
version = "0.1.0"
description = "Comparative Study of Graph Contrastive Learning Methods for Top-K Electronics Recommendation under Data Sparsity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "sympy==1.14.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0.0",
    "threadpoolctl>=3.1.0",
    "pydantic>=2.0",
    "streamlit>=1.25.0",
    "matplotlib>=3.7.0",
    "pytest>=7.3.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
# Old-model tests (RecFlow, SCSR, retired studies) are kept for traceability only.
addopts = "--ignore=tests/legacy"
